<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>FreshMart · Đi chợ liền tay, giao ngay trước tối</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="FreshMart – rau củ, trái cây, thịt cá chọn lọc mỗi sáng, giao trong 1–2 giờ ở TP.HCM. Meal Planner gợi ý món từ nguyên liệu bạn có.">
  <meta name="theme-color" content="#fefcf5">
  <link rel="icon" href="favicon.jpg" type="image/jpeg">
  <link rel="preload" href="fonts/Oswald-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/BeVietnamPro-Regular.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <!-- Hiện ngay khi HTML về, Angular thay thế khi đã sẵn sàng: tránh màn hình trắng lúc chờ dữ liệu -->
  <fm-root>
    <div style="min-height:100vh;display:grid;place-items:center;background:#fefcf5;font-family:system-ui,sans-serif;color:#121212">
      <div style="text-align:center">
        <div style="font-size:28px;font-weight:700;letter-spacing:.02em">FreshMart</div>
        <div style="margin:14px auto 0;width:120px;height:3px;background:#e8e2d0;border-radius:3px;overflow:hidden"><div style="width:40%;height:100%;background:#1f6f54;animation:fm-load 1s ease-in-out infinite alternate"></div></div>
      </div>
    </div>
    <style>@keyframes fm-load{from{transform:translateX(-10%)}to{transform:translateX(160%)}}</style>
  </fm-root>
</body>
</html>
