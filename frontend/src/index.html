<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>FreshMart · Đi chợ liền tay, giao ngay trước tối</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="FreshMart – rau củ, trái cây, thịt cá chọn lọc mỗi sáng, giao trong 1–2 giờ ở TP.HCM. Meal Planner gợi ý món từ nguyên liệu bạn có.">
  <meta name="theme-color" content="#fefcf5">
  <link rel="icon" href="favicon.jpg" type="image/jpeg">
  <!-- Mở sẵn kết nối tới nơi chứa ảnh sản phẩm để ảnh đầu tiên về sớm hơn -->
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <!-- Trang chủ: tải ngay ảnh nền hero (phần tử lớn nhất màn hình đầu), không đợi Angular khởi động xong -->
  <script>if (location.pathname === '/') { const l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = '/video/cho-noi.jpg'; l.fetchPriority = 'high'; document.head.appendChild(l); }</script>
  <link rel="preload" href="fonts/Oswald-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/BeVietnamPro-Regular.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <!-- App shell: HTML tự vẽ ngay màn hình đầu trong lúc JavaScript còn tải (Angular thay thế khi sẵn sàng).
       Trang chủ: khung hero thật (ảnh chợ nổi + tiêu đề) để người dùng thấy nội dung ngay, không phải màn hình chờ.
       Trang khác: thanh tải gọn. Script nhỏ bên dưới chọn loại khung theo đường dẫn. -->
  <fm-root>
    <style>
      /* Dùng lại class/biến của styles.css (đã tải trước khi trang hiện) để khung giống hệt trang thật.
         Kích thước header đo từ trang thật (điện thoại 175px, máy tính 120px); khung thấp hơn 1px để vùng ảnh
         của khung lớn hơn hero thật một chút: trình duyệt giữ ảnh khung làm phần tử lớn nhất (LCP), không đợi Angular. */
      .shell-hero{display:none}.shell-home .shell-hero{display:block}.shell-home .shell-load{display:none}
      .shell-hdr{height:119px;box-sizing:border-box;padding:21px var(--gut-r) 0 var(--gut-l);background:var(--paper);box-shadow:0 2px 0 var(--ink)}
      .shell-logo{font:700 34px/1 var(--display);letter-spacing:-.01em;text-transform:uppercase;color:var(--forest)}
      .shell-hv{position:relative;overflow:hidden;display:grid;place-items:center;min-height:clamp(560px,calc(100svh - 160px),820px);padding:64px var(--gut-r) 96px var(--gut-l);color:var(--cream);text-align:center}
      .shell-hv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
      .shell-hv::after{content:"";position:absolute;inset:0;background:rgb(18 18 18/.42)}
      .shell-copy{position:relative;z-index:1;max-width:920px}
      .shell-copy b{display:block;font:700 clamp(40px,5.6vw,96px)/var(--lh-head) var(--display);text-transform:uppercase}
      .shell-copy p{margin:20px auto 0;max-width:40ch;font-size:var(--t-lead)}
      .shell-copy .btn{margin-top:32px;background:var(--yellow);color:var(--ink)}
      @media (max-width:900px){.shell-hv{min-height:max(520px,calc(100svh - 233px))}}
      @media (max-width:760px){.shell-hdr{height:174px;padding-top:23px}.shell-logo{font-size:28px}}
      .shell-load{min-height:100vh;display:grid;place-items:center;background:#fefcf5;font-family:system-ui,sans-serif;color:#121212;text-align:center}
      .shell-load i{display:block;margin:14px auto 0;width:120px;height:3px;background:#e8e2d0;border-radius:3px;overflow:hidden}
      .shell-load i::after{content:"";display:block;width:40%;height:100%;background:#1f6f54;animation:fm-load 1s ease-in-out infinite alternate}
      @keyframes fm-load{from{transform:translateX(-10%)}to{transform:translateX(160%)}}
    </style>
    <div class="shell-hero" aria-hidden="true">
      <p class="notice">Miễn phí giao cho đơn từ 300.000 đ · Đặt trước 16:00, nhận hàng trong 1–2 giờ</p>
      <div class="shell-hdr"><span class="shell-logo">FreshMart</span></div>
      <div class="shell-hv"><img id="shell-img" alt="" fetchpriority="high">
        <div class="shell-copy"><b>Rau củ, trái cây<br>tươi mỗi sáng</b><p>Đặt trước 16:00, giao trong 1–2 giờ ở nội thành TP.HCM.</p><span class="btn">Đi chợ ngay</span></div>
      </div>
    </div>
    <div class="shell-load" aria-hidden="true"><div><div style="font-size:28px;font-weight:700;letter-spacing:.02em">FreshMart</div><i></i></div></div>
    <script>if (location.pathname === '/') { document.documentElement.classList.add('shell-home'); document.getElementById('shell-img').src = '/video/cho-noi.jpg'; }</script>
  </fm-root>
</body>
</html>
